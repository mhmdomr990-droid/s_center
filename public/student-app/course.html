<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المادة - تطبيق الطالب</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/student/css/student.css">
</head>
<body>
  <div class="student-shell">
    <nav id="studentNav" class="student-nav"></nav>
    <main class="student-main">
      <section id="studentBreadcrumb"></section>
      <section class="student-headline">
        <h1 id="courseTitle" class="student-page-title">تفاصيل المادة</h1>
        <p class="student-subtitle">قائمة المحاضرات والمحتوى المتاح.</p>
      </section>

      <section id="courseState"></section>

      <section id="buyPanel" class="student-card" hidden>
        <h3 class="student-section-title">هذه المادة غير مشتركة</h3>
        <p class="student-muted">اشترِ المادة للوصول الكامل إلى الدروس المقفلة.</p>
        <div class="student-actions">
          <button id="buyButton" type="button" class="student-btn student-btn-primary">شراء المادة</button>
          <a class="student-btn student-btn-secondary" href="/student/wallet.html">شحن المحفظة</a>
        </div>
        <p id="buyMessage" class="student-inline-message"></p>
      </section>

      <section id="lectureList" class="student-stack"></section>
    </main>
  </div>
  <script src="/js/polish.js"></script>
  <script type="module" src="/student/js/course.js"></script>
</body>
</html>
